# Runs NEO's tests on every push and pull request:
#   test/main      — the main process (saving, versions, Git backup, restore,
#                    library search, import), with Git pointed at a local
#                    stand-in for GitHub
#   test/renderer  — the writing room in headless Chromium, with an
#                    in-memory stand-in for the disk
# Nothing here needs secrets or touches a real library.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
